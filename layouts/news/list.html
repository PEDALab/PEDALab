{{ define "main" }}
<div class="container-fluid py-5">
  <div class="container">
    <!-- Page Header -->
    <div class="row mb-5">
      <div class="col-12 text-center">
        <h1 class="page-title display-4 mb-3">{{ .Title }}</h1>
        <p class="lead text-secondary">Stay updated with our latest lab announcements and research highlights</p>
      </div>
    </div>

    <!-- News List -->
    <div class="row">
      {{ range .Pages.ByPublishDate.Reverse }}
      <div class="col-lg-6 mb-4">
        <div class="card news-item">
          <div class="row g-0">
            <div class="col-md-9">
              <div class="card-body">
                <div class="text-success mb-2"><small>{{ .PublishDate.Format "January 2, 2006" }}</small></div>
                <h5 class="card-title text-primary">{{ .Title }}</h5>
                <p class="card-text text-secondary">{{ .Summary }}</p>
                <a href="{{ .Permalink }}" class="btn btn-outline btn-sm">Read More</a>
              </div>
            </div>
            <div class="col-md-3">
              <div class="news-image h-100 p-4">
                {{ with .Params.image }}
                <img src="{{ printf "/media/news/%s" .filename }}" alt="{{ $.Title }}" class="img-fluid h-100 w-100 rounded" style="object-fit: cover;">
                {{ else }}
                <img src="/media/news/default.jpg" alt="{{ $.Title }}" class="img-fluid h-100 w-100 rounded" style="object-fit: cover;">
                {{ end }}
              </div>
            </div>
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</div>

<style>
.news-item {
  border-left: 5px solid var(--secondary-color);
  border-radius: 8px;
  overflow: hidden;
  transition: all 0.3s ease;
}

.news-item:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(76, 175, 80, 0.2);
}

.news-image {
  position: relative;
  overflow: hidden;
  height: 100%;
}

.news-image img {
  transition: transform 0.3s ease;
}

.news-item:hover .news-image img {
  transform: scale(1.1);
}
</style>
{{ end }}
