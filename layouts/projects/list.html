{{ define "main" }}
<div class="container-fluid py-5">
  <div class="container">
    <!-- Page Header -->
    <div class="row mb-5">
      <div class="col-12 text-center">
        <h1 class="page-title display-4 mb-3">{{ .Title }}</h1>
        <p class="lead text-secondary">Innovative research projects in precision agriculture and computer vision</p>
      </div>
    </div>

    <!-- Project Filter Buttons -->
    <div class="row mb-4">
      <div class="col-12 text-center">
        <div class="btn-group project-filters" role="group">
          <button type="button" class="btn btn-outline active" data-filter="all">All Projects</button>
          <button type="button" class="btn btn-outline" data-filter="computer vision">Computer Vision</button>
          <button type="button" class="btn btn-outline" data-filter="robotics">Robotics</button>
          <button type="button" class="btn btn-outline" data-filter="machine learning">Machine Learning</button>
          <button type="button" class="btn btn-outline" data-filter="iot">IoT & Sensors</button>
        </div>
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="row" id="projects-grid">
      {{ range .Pages }}
      <div class="col-lg-4 col-md-6 mb-4 project-item" data-categories="{{ with .Params.tags }}{{ delimit . " " | lower }}{{ end }}">
        <div class="project-card h-100">
          <div class="project-image" style="height: 200px; overflow: hidden;">
            {{ with .Params.image }}
            <img src="{{ printf "/media/projects/%s" .filename }}" alt="{{ $.Title }}" class="img-fluid w-100 h-100" style="object-fit: cover;">
            {{ else }}
            <img src="/media/projects/default.jpg" alt="{{ $.Title }}" class="img-fluid w-100 h-100" style="object-fit: cover;">
            {{ end }}
          </div>
          <div class="card-body p-4">
            <h5 class="card-title text-primary">{{ .Title }}</h5>
            <p class="card-text text-summary">{{ .Summary }}</p>
            <a href="{{ .RelPermalink }}" class="btn btn-outline btn-sm">Learn More</a>
          </div>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</div>

<style>
.page-title {
  color: var(--text-primary);
  font-weight: 700;
}

.project-filters .btn {
  margin: 0 0.25rem 0.5rem;
  border-radius: 25px;
  padding: 0.5rem 1.5rem;
  transition: all 0.3s ease;
}

.project-filters .btn.active {
  background-color: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.project-card {
  transition: all 0.3s ease;
  border: 1px solid var(--border-color);
  background: var(--surface-dark);
}

.project-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 30px rgba(46, 125, 50, 0.3);
  border-color: var(--primary-color);
}

.project-image {
  position: relative;
  overflow: hidden;
}

.project-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.project-card:hover .project-image img {
  transform: scale(1.1);
}

.project-item {
  transition: opacity 0.3s ease;
}

.project-item.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Ensure text colors are preserved when card is a link */
.project-card .text-primary,
.project-card .text-summary,
.project-card .text-muted {
  color: inherit !important;
}

.card-text.text-summary {
  color: var(--text-summary) !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const filterButtons = document.querySelectorAll('.project-filters .btn');
  const projectItems = document.querySelectorAll('.project-item');

  filterButtons.forEach(button => {
    button.addEventListener('click', function() {
      // Remove active class from all buttons
      filterButtons.forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      this.classList.add('active');

      const filter = this.getAttribute('data-filter').toLowerCase();

      projectItems.forEach(item => {
        const categories = item.getAttribute('data-categories').toLowerCase();
        if (filter === 'all' || categories.includes(filter)) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
    });
  });
});
</script>
{{ end }}
