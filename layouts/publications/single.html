{{ define "main" }}
<div class="container-fluid py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <article>
          <header class="text-center mb-5">
            <h1 class="display-4 mb-3">{{ .Title }}</h1>
            <div class="text-muted mb-3">
              <i class="fas fa-users me-2"></i>{{ delimit .Params.authors ", " }}
              <span class="mx-2">|</span>
              <i class="far fa-calendar-alt me-2"></i><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            </div>
          </header>
          <div class="article-content text-secondary">
            {{ .Content }}
          </div>
          <div class="publication-links text-center mt-5">
            {{ if .Params.url_pdf }}
            <a href="{{ .Params.url_pdf }}" class="btn btn-primary me-3" target="_blank" rel="noopener">View PDF</a>
            {{ end }}
            {{ if .Params.url_code }}
            <a href="{{ .Params.url_code }}" class="btn btn-outline me-3" target="_blank" rel="noopener">GitHub Code</a>
            {{ end }}
            {{ if .Params.url_project }}
            <a href="{{ .Params.url_project }}" class="btn btn-outline" target="_blank" rel="noopener">Project Page</a>
            {{ end }}
          </div>
        </article>
      </div>
    </div>
  </div>
</div>

<style>
.article-content h2, .article-content h3, .article-content h4, .article-content h5, .article-content h6 {
  color: var(--text-primary);
  margin-top: 1.5rem;
  margin-bottom: 1rem;
}

.article-content p {
  line-height: 1.8;
  margin-bottom: 1rem;
}

.article-content ul, .article-content ol {
  margin-bottom: 1rem;
  padding-left: 1.5rem;
}

.article-content li {
  margin-bottom: 0.5rem;
}

.article-content a {
  color: var(--primary-color);
  text-decoration: none;
}

.article-content a:hover {
  text-decoration: underline;
}

.article-content img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin-top: 1rem;
  margin-bottom: 1rem;
}

.article-content blockquote {
  border-left: 4px solid var(--primary-color);
  padding-left: 1rem;
  margin-left: 0;
  font-style: italic;
  color: var(--text-secondary);
}

.article-content pre {
  background-color: var(--surface-dark);
  padding: 1rem;
  border-radius: 8px;
  overflow-x: auto;
}

.article-content code {
  font-family: "Fira Code", "Cascadia Code", monospace;
  color: var(--accent-color);
}
</style>
{{ end }}
